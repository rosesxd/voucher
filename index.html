<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador Jarvis - ADN Travels</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; display: flex; justify-content: center; padding: 20px; }
        .panel { background: #16213e; padding: 30px; border-radius: 15px; border: 1px solid #0f3460; width: 100%; max-width: 500px; }
        h2 { color: #4ecca3; text-align: center; }
        label { display: block; margin: 10px 0 5px; font-size: 0.9em; color: #95a5a6; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: none; background: #0f3460; color: white; }
        button { width: 100%; padding: 15px; background: #e94560; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #ff2e63; }
    </style>
</head>
<body>

<div class="panel">
    <h2>ADN Travels - Jarvis Gen</h2>
    
    <label>Localizador:</label>
    <input type="text" id="loc" placeholder="1052/1053">
    
    <label>Voucher Nº:</label>
    <input type="text" id="vouch" placeholder="AT-22-05">

    <label>Hotel:</label>
    <input type="text" id="hotel">

    <label>Huésped Principal:</label>
    <input type="text" id="huesped">

    <label>Entrada:</label>
    <input type="date" id="entrada">

    <label>Salida:</label>
    <input type="date" id="salida">

    <label>Info Adicional:</label>
    <input type="text" id="info" placeholder="Ej: 5 Adultos, 1 infante">

    <button onclick="generarVoucher()">GENERAR VOUCHER (3 PÁGS)</button>
</div>

<script>
    async function generarVoucher() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');

        // --- PÁGINA 1: VOUCHER ---
        // Usamos la ruta lol/ porque las fotos están en esa carpeta
        try {
            doc.addImage('lol/fondo1.jpg', 'JPEG', 0, 0, 210, 297);
        } catch (e) {
            alert("Error: No se encontró 'lol/fondo1.jpg'. Revisa que la carpeta se llame lol.");
            return;
        }

        doc.setFontSize(10);
        doc.setTextColor(40, 40, 40);

        // Datos del formulario
        const hotel = document.getElementById('hotel').value;
        const huesped = document.getElementById('huesped').value;
        const loc = document.getElementById('loc').value;
        const vouch = document.getElementById('vouch').value;
        const info = document.getElementById('info').value;

        // Posicionamiento de los datos (ajusta estos números si salen movidos)
    
doc.text(loc, 185, 26);      // Sube a la esquina del Localizador
doc.text(vouch, 110, 48);    // Baja al renglón del Nº de Voucher
doc.text(hotel, 80, 112);    // Baja al cuadro de "Nombre del hotel"
doc.text(huesped, 80, 140);  // Baja al cuadro de "Reservación"
doc.text(info, 80, 215);     // Baja al cuadro de "Info Adicional"

        // --- PÁGINA 2: POLÍTICAS 1 ---
        doc.addPage();
        doc.addImage('lol/fondo2.jpg', 'JPEG', 0, 0, 210, 297);

        // --- PÁGINA 3: POLÍTICAS 2 ---
        doc.addPage();
        doc.addImage('lol/fondo3.jpg', 'JPEG', 0, 0, 210, 297);

        doc.save(`Voucher_ADN_${huesped}.pdf`);
    }
</script>
</body>
</html>
