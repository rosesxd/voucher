<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador Jarvis - ADN Travels</title>
    <!-- Cargamos jsPDF para la magia del PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; display: flex; justify-content: center; padding: 20px; }
        .panel { background: #16213e; padding: 30px; border-radius: 15px; border: 1px solid #0f3460; box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        h2 { color: #4ecca3; text-align: center; }
        label { display: block; margin: 10px 0 5px; font-size: 0.9em; color: #95a5a6; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: none; border-radius: 5px; background: #0f3460; color: white; }
        button { width: 100%; padding: 15px; background: #e94560; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        button:hover { background: #ff2e63; transform: scale(1.02); }
    </style>
</head>
<body>

<div class="panel">
    <h2>ADN Travels - Panel Jarvis</h2>
    
    <label>Localizador:</label>
    <input type="text" id="loc" placeholder="Ej: 1052/1053">
    
    <label>Voucher Nº:</label>
    <input type="text" id="vouch" placeholder="Ej: AT-22-05">

    <label>Hotel:</label>
    <input type="text" id="hotel" placeholder="Nombre del Hotel">

    <label>Huésped Principal:</label>
    <input type="text" id="huesped" placeholder="Nombre Completo">

    <label>Check-in (Fecha):</label>
    <input type="date" id="entrada">

    <label>Check-out (Fecha):</label>
    <input type="date" id="salida">

    <label>Información Adicional:</label>
    <input type="text" id="info" placeholder="5 Adultos, 0 niños, 1 infantes">

    <button onclick="generarVoucher()">GENERAR PDF DE 3 PÁGINAS</button>
</div>

<script>
    async function generarVoucher() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4'); // Tamaño A4 estándar

        // 1. Cargar datos del formulario
        const hotel = document.getElementById('hotel').value;
        const loc = document.getElementById('loc').value;
        const vouch = document.getElementById('vouch').value;
        const huesped = document.getElementById('huesped').value;
        const entrada = document.getElementById('entrada').value;
        const salida = document.getElementById('salida').value;
        const info = document.getElementById('info').value;

        // --- PÁGINA 1: VOUCHER ---
        // Aquí cargamos tu fondo limpio. 'fondo1.jpg' debe existir.
        try {
            doc.addImage('fondo1.jpg', 'JPEG', 0, 0, 210, 297);
        } catch (e) {
            alert("Error: No se encontró 'fondo1.jpg'. Asegúrate de que esté en la misma carpeta.");
            return;
        }

        // Configuración de texto para los datos
        doc.setFontSize(10);
        doc.setTextColor(40, 40, 40); // Color oscuro para los datos

        // Coordenadas aproximadas (X, Y) - DEBES AJUSTAR ESTOS NÚMEROS
        doc.text(loc, 175, 23);       // Arriba a la derecha (Localizador)
        doc.text(vouch, 110, 39);     // Título del Voucher
        
        doc.text(hotel, 75, 61);      // Renglón Hotel
        doc.text(huesped, 75, 84);    // Renglón Reservación
        doc.text(entrada, 75, 93);    // Renglón Entrada
        doc.text(salida, 75, 108);    // Renglón Salida
        doc.text(info, 75, 142);      // Renglón Info Adicional

        // --- PÁGINA 2: POLÍTICAS 1 ---
        doc.addPage();
        doc.addImage('fondo2.jpg', 'JPEG', 0, 0, 210, 297);

        // --- PÁGINA 3: POLÍTICAS 2 ---
        doc.addPage();
        doc.addImage('fondo3.jpg', 'JPEG', 0, 0, 210, 297);

        // Descarga final
        doc.save(`Voucher_ADN_${huesped}.pdf`);
    }
</script>

</body>
</html>
